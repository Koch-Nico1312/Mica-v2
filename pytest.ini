[pytest]
testpaths = tests backend/tests
pythonpath = .
addopts = --strict-config --strict-markers -ra
timeout = 120
timeout_method = thread
norecursedirs = .git .venv* .uv-cache node_modules artifacts legacy
markers =
    integration: tests requiring a separately running service
    hardware: tests requiring microphone, speaker, GPU or another physical device
    performance: assertions against explicit measured performance limits
