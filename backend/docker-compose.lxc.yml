# Experimental CPU-only Proxmox LXC override.  It uses Compose's documented
# !reset merge tag to remove the NVIDIA reservation and selects llama.cpp's
# documented CPU server image.  Validate with `docker compose ... config`.
services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >-
      -m /models/${LLAMA_MODEL:?Set LLAMA_MODEL in .env}
      --host 0.0.0.0 --port 8080 --n-gpu-layers 0
      --ctx-size 8192
    deploy:
      resources:
        reservations:
          devices: !reset []
